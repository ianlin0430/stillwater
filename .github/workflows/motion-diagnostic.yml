name: Motion diagnostic

# Complete motion regressions in the cloud. Full app acceptance also requires
# the complete core, ecology matrices, native review and physical acceptance.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, horse-night, obstacle-stall]
        default: full
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: full

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
      - name: Import
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000
      - name: Reproduce the two original obstacle stalls
        if: inputs.mode == 'obstacle-stall'
        working-directory: stream
        run: |
          mkdir -p ../motion-results
          fail=0
          for variant in baseline stable; do
          extra=()
          if [[ "$variant" == stable ]]; then extra+=(--stable-horse-pass); fi
          set +e
          timeout 600 godot --headless --path . --script tests/test_obstacle_stall_regression.gd -- "${extra[@]}" 2>&1 | tee "../motion-results/replay-$variant.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "../motion-results/replay-$variant.exit"
          if [[ "$code" != 0 ]]; then fail=1; fi
          for case in min:17 max:42; do
            preset=${case%:*}
            seed=${case#*:}
            log="../motion-results/shipwreck-$preset-$seed-$variant.log"
            extra=()
            if [[ "$variant" == stable ]]; then extra+=(--stable-horse-pass); fi
            set +e
            timeout 600 godot --headless --path . --script tests/test_obstacles.gd -- --seeds="$seed" --scenes=shipwreck --presets="$preset" --parts=obstacles --trace-hitch-path "${extra[@]}" 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "${log%.log}.exit"
            if [[ "$code" != 0 ]] \
              || ! grep '^{.*"failures"' "$log" | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null \
              || grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' "$log"; then
              fail=1
            fi
          done
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'obstacle-stall'
        with:
          name: obstacle-stall-diagnostic
          path: |
            motion-results/
            stream/artifacts/obstacle-stall/
      - name: Isolated original night-horse trigger
        if: inputs.mode == 'horse-night'
        working-directory: stream
        run: |
          mkdir -p ../motion-results
          set +e
          timeout 600 godot --headless --path . --script tests/test_seahorse_night_regression.gd 2>&1 | tee ../motion-results/night-horse.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ../motion-results/night-horse.exit
          [[ "$code" == 0 ]]
          grep '^{.*"failures"' ../motion-results/night-horse.log | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null
          ! grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' ../motion-results/night-horse.log
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'horse-night'
        with:
          name: night-horse-diagnostic
          path: motion-results/
      - name: Complete natural motion, seahorse and decor gates
        if: inputs.mode == 'full'
        working-directory: stream
        run: |
          mkdir -p ../motion-results
          fail=0
          for suite in test_natural_motion test_seahorse test_decor_art; do
            set +e
            timeout 900 godot --headless --path . --script "tests/$suite.gd" 2>&1 | tee "../motion-results/$suite.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "../motion-results/$suite.exit"
            if [[ "$code" != 0 ]] \
              || ! grep '^{.*"failures"' "../motion-results/$suite.log" | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null \
              || grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' "../motion-results/$suite.log"; then
              echo "::error::$suite failed"; fail=1
            fi
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'full'
        with:
          name: motion-regression-first
          path: motion-results/
      # Only spend the full S5 runtime after the preceding complete gates pass.
      # This is diagnostic scheduling, never a replacement for final core.
      - name: Complete original 16-seed obstacle gate
        if: inputs.mode == 'full'
        working-directory: stream
        run: |
          set +e
          timeout 3600 godot --headless --path . --script tests/test_obstacles.gd 2>&1 | tee ../motion-results/test_obstacles.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ../motion-results/test_obstacles.exit
          [[ "$code" == 0 ]]
          grep '^{.*"failures"' ../motion-results/test_obstacles.log | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null
          ! grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' ../motion-results/test_obstacles.log
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'full'
        with:
          name: motion-regression-complete
          path: motion-results/
