name: Ecology batch

# Long seeded ecology runs are CPU-bound for hours, so they run here instead of
# on the Mac. Packaged-app persistence and the performance acceptance stay
# local: they need macOS and the user's real machine.
#
# A 180-day live run no longer fits GitHub's 6-hour job limit, so each seed's
# run is split into three chained jobs (chunk1 -> chunk2 -> chunk3), each
# simulating days/3 days and handing the exact world + accumulators on as a
# checkpoint artifact (tests/long_run.gd --from-day/--to-day/--checkpoint-*).
# Only chunk3 judges the full run and writes the report; the gates are the
# same as an unchunked run's.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: live or offline
        type: choice
        options: [live, offline]
        default: live
      days:
        description: simulated days per seed (a multiple of 3; run as 3 chained chunks)
        default: "180"
      seeds:
        description: comma-separated seeds, one job each
        default: "42,812,240921"
      year:
        description: also run the extra 365-day offline stability pass
        type: boolean
        default: false
      feed:
        description: none (never fed) or daily (four pinches a day, the daily cap)
        type: choice
        options: [none, daily]
        default: none
      scene:
        description: scene for a single configuration
        type: choice
        options: [reef, shipwreck]
        default: reef
      decor:
        description: decor for a single configuration
        type: choice
        options: [default, min, max]
        default: default
      acceptance_matrix:
        description: run both scenes, min/max decor and none/daily feeding for every seed
        type: boolean
        default: false

# An explicit bash shell turns on pipefail, so a failing test or acceptance
# gate fails the job instead of being hidden behind tee.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan chunks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      third: ${{ steps.split.outputs.third }}
      two_thirds: ${{ steps.split.outputs.two_thirds }}
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - id: split
        env:
          DAYS: ${{ inputs.days }}
        run: |
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || (( DAYS == 0 || DAYS % 3 != 0 )); then
            echo "::error::days=$DAYS must be a positive multiple of 3: the run is split into 3 chained jobs of days/3 each"
            exit 1
          fi
          DAYS=$((10#$DAYS))
          echo "third=$((DAYS/3))" >> "$GITHUB_OUTPUT"
          echo "two_thirds=$((2*DAYS/3))" >> "$GITHUB_OUTPUT"
          echo "chunks: 0-$((DAYS/3)), $((DAYS/3))-$((2*DAYS/3)), $((2*DAYS/3))-$DAYS"

      - id: cases
        env:
          RUN_SEEDS: ${{ inputs.seeds }}
          RUN_SCENE: ${{ inputs.scene }}
          RUN_DECOR: ${{ inputs.decor }}
          RUN_FEED: ${{ inputs.feed }}
          RUN_MATRIX: ${{ inputs.acceptance_matrix }}
        run: |
          python3 - <<'PY'
          import itertools, json, os
          seeds = [int(s) for s in os.environ['RUN_SEEDS'].split(',')]
          if not seeds or len(seeds) != len(set(seeds)):
              raise SystemExit('seeds must be a nonempty list of distinct integers')
          broad = os.environ['RUN_MATRIX'] == 'true'
          scenes = ['reef', 'shipwreck'] if broad else [os.environ['RUN_SCENE']]
          decor = ['min', 'max'] if broad else [os.environ['RUN_DECOR']]
          feeds = ['none', 'daily'] if broad else [os.environ['RUN_FEED']]
          cases = [dict(seed=s, scene=c, decor=d, feed=f) for s,c,d,f in itertools.product(seeds,scenes,decor,feeds)]
          if len(cases) > 256:
              raise SystemExit('matrix exceeds 256 jobs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('cases=' + json.dumps(cases, separators=(',', ':')) + '\n')
          PY

  core:
    name: core tests
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      # Godot exits 0 even when a test script fails to load, so a suite passes only
      # if it exits 0, its last result line has an empty/zero "failures", and the
      # log has no script or resource load error. A suite that hangs (a runtime
      # error before quit()) is stopped after 15 minutes and fails.
      - name: Core tests
        working-directory: stream
        run: |
          fail=0
          for t in test_world test_swimmers test_roaming test_lifecycle test_persist_qa test_presentation test_frontend test_reef_animation test_natural_motion test_obstacles test_stage_scenes test_long_run_chunks test_scene_data test_scene_switch test_save_v3 test_home_layout_restore test_home_geometry test_home_behaviors test_seahorse test_gramma test_chromis_roost test_clownfish test_clownfish_contract test_departures test_frame_pacer test_cast_transition test_decor_art test_new_fish_art test_mirror_turn; do
            echo "== $t"
            if timeout 900 godot --headless --path . --script "tests/$t.gd" 2>&1 | tee "../$t.log" \
              && grep '^{.*"failures"' "../$t.log" | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null \
              && ! grep -qE 'SCRIPT ERROR|Parse Error|Failed loading resource' "../$t.log"; then
              echo "PASS $t"
            else
              echo "::error::$t failed (exit code, failures JSON or load error)"; fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-core-tests
          path: "*.log"
          if-no-files-found: warn

  chunk1:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 1/3
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      - name: Long run days 0-${{ needs.plan.outputs.third }}
        working-directory: stream
        run: |
          godot --headless --path . --script tests/long_run.gd -- \
            --mode=${{ inputs.mode }} --days=${{ inputs.days }} \
            --seeds=${{ matrix.seed }} --year=false --feed=${{ matrix.feed }} --scene=${{ matrix.scene }} --decor=${{ matrix.decor }} \
            --to-day=${{ needs.plan.outputs.third }} \
            --checkpoint-out=ckpt/day-${{ needs.plan.outputs.third }}.world \
            2>&1 | tee ../long-run-chunk-1.log

      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-day-${{ needs.plan.outputs.third }}
          path: stream/artifacts/ckpt/day-${{ needs.plan.outputs.third }}.world*
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-chunk-1-log
          path: long-run-chunk-1.log
          if-no-files-found: warn

  # chunk2 and chunk3 still run for the other seeds when one seed failed an
  # earlier chunk; that seed then fails here at its missing checkpoint.
  chunk2:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 2/3
    needs: [plan, chunk1]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-day-${{ needs.plan.outputs.third }}
          path: stream/artifacts/ckpt

      - name: Long run days ${{ needs.plan.outputs.third }}-${{ needs.plan.outputs.two_thirds }}
        working-directory: stream
        run: |
          godot --headless --path . --script tests/long_run.gd -- \
            --mode=${{ inputs.mode }} --days=${{ inputs.days }} \
            --seeds=${{ matrix.seed }} --year=false --feed=${{ matrix.feed }} --scene=${{ matrix.scene }} --decor=${{ matrix.decor }} \
            --from-day=${{ needs.plan.outputs.third }} --to-day=${{ needs.plan.outputs.two_thirds }} \
            --checkpoint-in=ckpt/day-${{ needs.plan.outputs.third }}.world \
            --checkpoint-out=ckpt/day-${{ needs.plan.outputs.two_thirds }}.world \
            2>&1 | tee ../long-run-chunk-2.log

      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-day-${{ needs.plan.outputs.two_thirds }}
          path: stream/artifacts/ckpt/day-${{ needs.plan.outputs.two_thirds }}.world*
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-chunk-2-log
          path: long-run-chunk-2.log
          if-no-files-found: warn

  chunk3:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 3/3
    needs: [plan, chunk2]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}-day-${{ needs.plan.outputs.two_thirds }}
          path: stream/artifacts/ckpt

      # The final chunk judges the whole run: a failing gate exits 1 and fails this job.
      - name: Long run days ${{ needs.plan.outputs.two_thirds }}-${{ inputs.days }} and acceptance
        working-directory: stream
        run: |
          godot --headless --path . --script tests/long_run.gd -- \
            --mode=${{ inputs.mode }} --days=${{ inputs.days }} \
            --seeds=${{ matrix.seed }} --year=${{ inputs.year }} --feed=${{ matrix.feed }} --scene=${{ matrix.scene }} --decor=${{ matrix.decor }} \
            --from-day=${{ needs.plan.outputs.two_thirds }} \
            --checkpoint-in=ckpt/day-${{ needs.plan.outputs.two_thirds }}.world \
            --out=ci-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-${{ matrix.seed }}.json \
            2>&1 | tee ../long-run-chunk-3.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-${{ inputs.mode }}-${{ inputs.days }}d-${{ matrix.scene }}-${{ matrix.decor }}-feed-${{ matrix.feed }}-seed-${{ matrix.seed }}
          path: |
            long-run-chunk-3.log
            stream/artifacts/ci-*.json
          if-no-files-found: warn
