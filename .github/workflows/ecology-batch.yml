name: Ecology batch

# Long seeded ecology runs are CPU-bound for hours, so they run here instead of
# on the Mac. Packaged-app persistence and the performance acceptance stay
# local: they need macOS and the user's real machine.
#
# Live180d is split into ten chained18-day jobs. The original60-day chunks
# timed out at21-52 days on hosted runners. Exact world/accumulator checkpoints
# preserve the full simulation; only the final chunk judges acceptance.
#
# resume_run continues a live run from that run's per-case checkpoints with
# shorter chunks (resume_chunk_days) when the 18-day chunks outgrew the 6 h job
# limit. The plan job fails unless every start checkpoint is an unexpired
# artifact of exactly that run at resume_sha and the app tree equals resume_sha.

on:
  workflow_dispatch:
    inputs:
      reuse_motion_run:
        description: optional completed full-motion run with identical app/tests; blank reruns everything
        default: ""
      motion_case:
        description: full motion regression or the isolated failing night-horse trigger
        type: choice
        options: [full, horse-night, obstacle-stall, obstacle-replay]
        default: full
      motion_diagnostic:
        description: only reproduce known motion failures; no ecology or full acceptance
        type: boolean
        default: false
      mode:
        description: live or offline
        type: choice
        options: [live, offline]
        default: live
      days:
        description: simulated days per seed (multiple of 3; up to 10 exact chained chunks)
        default: "180"
      seeds:
        description: comma-separated seeds, one job each
        default: "42,812,240921"
      year:
        description: also run the extra 365-day offline stability pass
        type: boolean
        default: false
      feed:
        description: none (never fed) or daily (four pinches a day, the daily cap)
        type: choice
        options: [none, daily]
        default: none
      scene:
        description: scene for a single configuration
        type: choice
        options: [reef, shipwreck]
        default: reef
      decor:
        description: decor for a single configuration
        type: choice
        options: [default, min, max]
        default: default
      acceptance_matrix:
        description: run both scenes, min/max decor and none/daily feeding for every seed
        type: boolean
        default: false
      run_core:
        description: also run the complete core suite (skip only for a separate ecology-only companion run)
        type: boolean
        default: true
      resume_run:
        description: live only; blank starts fresh, else the earlier run id whose checkpoints are continued
        default: ""
      resume_sha:
        description: exact 40-character revision of resume_run (its checkpoints must come from it)
        default: ""
      resume_chunk_days:
        description: days per chunk when resuming (at most 16 chunks per case)
        default: "9"
      resume_start:
        description: day of the checkpoint every resumed case starts from
        default: ""
      resume_overrides:
        description: "comma list scene/decor/feed/seed=day for cases whose checkpoint day differs from resume_start"
        default: ""

# An explicit bash shell turns on pipefail, so a failing test or acceptance
# gate fails the job instead of being hidden behind tee.
defaults:
  run:
    shell: bash

jobs:
  motion-diagnostic:
    if: inputs.motion_diagnostic
    uses: ./.github/workflows/motion-diagnostic.yml
    with:
      mode: ${{ inputs.motion_case }}

  plan:
    if: ${{ !inputs.motion_diagnostic }}
    name: plan chunks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      cases1: ${{ steps.plan.outputs.cases1 }}
      cases2: ${{ steps.plan.outputs.cases2 }}
      cases3: ${{ steps.plan.outputs.cases3 }}
      cases4: ${{ steps.plan.outputs.cases4 }}
      cases5: ${{ steps.plan.outputs.cases5 }}
      cases6: ${{ steps.plan.outputs.cases6 }}
      cases7: ${{ steps.plan.outputs.cases7 }}
      cases8: ${{ steps.plan.outputs.cases8 }}
      cases9: ${{ steps.plan.outputs.cases9 }}
      cases10: ${{ steps.plan.outputs.cases10 }}
      cases11: ${{ steps.plan.outputs.cases11 }}
      cases12: ${{ steps.plan.outputs.cases12 }}
      cases13: ${{ steps.plan.outputs.cases13 }}
      cases14: ${{ steps.plan.outputs.cases14 }}
      cases15: ${{ steps.plan.outputs.cases15 }}
      cases16: ${{ steps.plan.outputs.cases16 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          RUN_DAYS: ${{ inputs.days }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_YEAR: ${{ inputs.year }}
          RUN_SEEDS: ${{ inputs.seeds }}
          RUN_SCENE: ${{ inputs.scene }}
          RUN_DECOR: ${{ inputs.decor }}
          RUN_FEED: ${{ inputs.feed }}
          RUN_MATRIX: ${{ inputs.acceptance_matrix }}
          RUN_RESUME_RUN: ${{ inputs.resume_run }}
          RUN_RESUME_SHA: ${{ inputs.resume_sha }}
          RUN_RESUME_CHUNK: ${{ inputs.resume_chunk_days }}
          RUN_RESUME_START: ${{ inputs.resume_start }}
          RUN_RESUME_OVERRIDES: ${{ inputs.resume_overrides }}
          GH_TOKEN: ${{ github.token }}
        run: python3 stream/tools/cloud_plan.py --verify

  core:
    name: core tests
    if: ${{ inputs.run_core && !inputs.motion_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Verify identical complete motion evidence
        id: reuse
        if: inputs.reuse_motion_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MOTION_RUN: ${{ inputs.reuse_motion_run }}
        run: python3 stream/tools/cloud_motion_reuse.py --run "$MOTION_RUN" --repo "$GITHUB_REPOSITORY" --output .


      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      # Godot exits 0 even when a test script fails to load, so a suite passes only
      # if it exits 0, its last result line has an empty/zero "failures", and the
      # log has no script or resource load error. A suite that hangs (a runtime
      # error before quit()) is stopped after 15 minutes and fails. The full
      # 16-seed obstacle matrix gets 60 minutes: the last hosted pass took
      # 29m29s, leaving almost no margin under the previous30-minute timeout.
      - name: Core tests
        working-directory: stream
        env:
          REUSED_MOTION: ${{ steps.reuse.outputs.verified }}
        run: |
          python3 tools/test_low_power_check.py
          python3 tools/test_cloud_plan.py
          python3 tools/test_cloud_motion_reuse.py
          python3 tools/test_cloud_acceptance.py
          python3 tools/test_cloud_offline_acceptance.py
          python3 tools/test_persistence_acceptance.py
          fail=0
          for t in test_world test_swimmers test_roaming test_lifecycle test_persist_qa test_presentation test_frontend test_reef_animation test_natural_motion test_obstacles test_stage_scenes test_long_run_chunks test_scene_data test_scene_switch test_save_v3 test_home_layout_restore test_home_geometry test_home_behaviors test_seahorse test_gramma test_chromis_roost test_clownfish test_clownfish_contract test_departures test_frame_pacer test_cast_transition test_decor_art test_new_fish_art test_mirror_turn; do
            echo "== $t"
            budget=900
            if [[ "$t" == test_obstacles ]]; then budget=3600; fi
            case "$REUSED_MOTION/$t" in
              true/test_natural_motion|true/test_obstacles|true/test_seahorse|true/test_decor_art)
                echo "Reusing identical-source complete motion evidence for $t" ;;
              *)
                if ! timeout "$budget" godot --headless --path . --script "tests/$t.gd" 2>&1 | tee "../$t.log"; then
                  echo "::error::$t failed (exit code)"; fail=1; continue
                fi ;;
            esac
            if grep '^{.*"failures"' "../$t.log" | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null \
              && ! grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' "../$t.log"; then
              echo "PASS $t"
            else
              echo "::error::$t failed (exit code, failures JSON or load error)"; fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-core-tests
          path: |
            *.log
            motion-reuse-verified.json
          if-no-files-found: warn

  chunk1:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 1/${{ matrix.n }}
    needs: [plan, core]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && (!inputs.run_core || needs.core.result == 'success') && fromJSON(needs.plan.outputs.chunks) >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases1) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ matrix.from_day }}
          to-day: ${{ matrix.to_day }}
          source-run: ${{ matrix.src }}
          index: '1'

