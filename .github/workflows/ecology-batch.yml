name: Ecology batch

# Long seeded ecology runs are CPU-bound for hours, so they run here instead of
# on the Mac. Packaged-app persistence and the performance acceptance stay
# local: they need macOS and the user's real machine.
#
# Live180d is split into ten chained18-day jobs. The original60-day chunks
# timed out at21-52 days on hosted runners. Exact world/accumulator checkpoints
# preserve the full simulation; only the final chunk judges acceptance.

on:
  workflow_dispatch:
    inputs:
      motion_case:
        description: full motion regression or the isolated failing night-horse trigger
        type: choice
        options: [full, horse-night]
        default: full
      motion_diagnostic:
        description: only reproduce known motion failures; no ecology or full acceptance
        type: boolean
        default: false
      mode:
        description: live or offline
        type: choice
        options: [live, offline]
        default: live
      days:
        description: simulated days per seed (multiple of 3; up to 10 exact chained chunks)
        default: "180"
      seeds:
        description: comma-separated seeds, one job each
        default: "42,812,240921"
      year:
        description: also run the extra 365-day offline stability pass
        type: boolean
        default: false
      feed:
        description: none (never fed) or daily (four pinches a day, the daily cap)
        type: choice
        options: [none, daily]
        default: none
      scene:
        description: scene for a single configuration
        type: choice
        options: [reef, shipwreck]
        default: reef
      decor:
        description: decor for a single configuration
        type: choice
        options: [default, min, max]
        default: default
      acceptance_matrix:
        description: run both scenes, min/max decor and none/daily feeding for every seed
        type: boolean
        default: false
      run_core:
        description: also run the complete core suite (skip only for a separate ecology-only companion run)
        type: boolean
        default: true

# An explicit bash shell turns on pipefail, so a failing test or acceptance
# gate fails the job instead of being hidden behind tee.
defaults:
  run:
    shell: bash

jobs:
  motion-diagnostic:
    if: inputs.motion_diagnostic
    uses: ./.github/workflows/motion-diagnostic.yml
    with:
      mode: ${{ inputs.motion_case }}

  plan:
    if: ${{ !inputs.motion_diagnostic }}
    name: plan chunks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      chunks: ${{ steps.plan.outputs.chunks }}
      from1: ${{ steps.plan.outputs.from1 }}
      to1: ${{ steps.plan.outputs.to1 }}
      from2: ${{ steps.plan.outputs.from2 }}
      to2: ${{ steps.plan.outputs.to2 }}
      from3: ${{ steps.plan.outputs.from3 }}
      to3: ${{ steps.plan.outputs.to3 }}
      from4: ${{ steps.plan.outputs.from4 }}
      to4: ${{ steps.plan.outputs.to4 }}
      from5: ${{ steps.plan.outputs.from5 }}
      to5: ${{ steps.plan.outputs.to5 }}
      from6: ${{ steps.plan.outputs.from6 }}
      to6: ${{ steps.plan.outputs.to6 }}
      from7: ${{ steps.plan.outputs.from7 }}
      to7: ${{ steps.plan.outputs.to7 }}
      from8: ${{ steps.plan.outputs.from8 }}
      to8: ${{ steps.plan.outputs.to8 }}
      from9: ${{ steps.plan.outputs.from9 }}
      to9: ${{ steps.plan.outputs.to9 }}
      from10: ${{ steps.plan.outputs.from10 }}
      to10: ${{ steps.plan.outputs.to10 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          RUN_DAYS: ${{ inputs.days }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_YEAR: ${{ inputs.year }}
          RUN_SEEDS: ${{ inputs.seeds }}
          RUN_SCENE: ${{ inputs.scene }}
          RUN_DECOR: ${{ inputs.decor }}
          RUN_FEED: ${{ inputs.feed }}
          RUN_MATRIX: ${{ inputs.acceptance_matrix }}
        run: python3 stream/tools/cloud_plan.py

  core:
    name: core tests
    if: ${{ inputs.run_core && !inputs.motion_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          set -eu
          url=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        working-directory: stream
        run: godot --headless --path . --import --quit-after 2000 || true

      # Godot exits 0 even when a test script fails to load, so a suite passes only
      # if it exits 0, its last result line has an empty/zero "failures", and the
      # log has no script or resource load error. A suite that hangs (a runtime
      # error before quit()) is stopped after 15 minutes and fails. The full
      # 16-seed obstacle matrix gets 60 minutes: the last hosted pass took
      # 29m29s, leaving almost no margin under the previous30-minute timeout.
      - name: Core tests
        working-directory: stream
        run: |
          python3 tools/test_low_power_check.py
          python3 tools/test_cloud_plan.py
          python3 tools/test_cloud_acceptance.py
          python3 tools/test_cloud_offline_acceptance.py
          python3 tools/test_persistence_acceptance.py
          fail=0
          for t in test_world test_swimmers test_roaming test_lifecycle test_persist_qa test_presentation test_frontend test_reef_animation test_natural_motion test_obstacles test_stage_scenes test_long_run_chunks test_scene_data test_scene_switch test_save_v3 test_home_layout_restore test_home_geometry test_home_behaviors test_seahorse test_gramma test_chromis_roost test_clownfish test_clownfish_contract test_departures test_frame_pacer test_cast_transition test_decor_art test_new_fish_art test_mirror_turn; do
            echo "== $t"
            budget=900
            if [[ "$t" == test_obstacles ]]; then budget=3600; fi
            if timeout "$budget" godot --headless --path . --script "tests/$t.gd" 2>&1 | tee "../$t.log" \
              && grep '^{.*"failures"' "../$t.log" | tail -1 | jq -e '.failures==[] or .failures==0' >/dev/null \
              && ! grep -qE '^ERROR:|SCRIPT ERROR|Parse Error|Failed loading resource' "../$t.log"; then
              echo "PASS $t"
            else
              echo "::error::$t failed (exit code, failures JSON or load error)"; fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecology-core-tests
          path: "*.log"
          if-no-files-found: warn

  chunk1:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 1/${{ needs.plan.outputs.chunks }}
    needs: [plan, core]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && (!inputs.run_core || needs.core.result == 'success') && fromJSON(needs.plan.outputs.chunks) >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from1 }}
          to-day: ${{ needs.plan.outputs.to1 }}
          index: '1'

  chunk2:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 2/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk1]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk1.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from2 }}
          to-day: ${{ needs.plan.outputs.to2 }}
          index: '2'

  chunk3:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 3/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk2]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk2.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from3 }}
          to-day: ${{ needs.plan.outputs.to3 }}
          index: '3'

  chunk4:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 4/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk3]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk3.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from4 }}
          to-day: ${{ needs.plan.outputs.to4 }}
          index: '4'

  chunk5:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 5/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk4]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk4.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 5 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from5 }}
          to-day: ${{ needs.plan.outputs.to5 }}
          index: '5'

  chunk6:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 6/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk5]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk5.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 6 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from6 }}
          to-day: ${{ needs.plan.outputs.to6 }}
          index: '6'

  chunk7:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 7/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk6]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk6.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from7 }}
          to-day: ${{ needs.plan.outputs.to7 }}
          index: '7'

  chunk8:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 8/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk7]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk7.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 8 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from8 }}
          to-day: ${{ needs.plan.outputs.to8 }}
          index: '8'

  chunk9:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 9/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk8]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk8.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 9 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from9 }}
          to-day: ${{ needs.plan.outputs.to9 }}
          index: '9'

  chunk10:
    name: ${{ inputs.mode }} ${{ inputs.days }}d feed-${{ matrix.feed }} ${{ matrix.scene }}/${{ matrix.decor }} seed ${{ matrix.seed }} chunk 10/${{ needs.plan.outputs.chunks }}
    needs: [plan, chunk9]
    if: ${{ !inputs.motion_diagnostic && !cancelled() && needs.plan.result == 'success' && needs.chunk9.result == 'success' && fromJSON(needs.plan.outputs.chunks) >= 10 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ecology-chunk
        with:
          mode: ${{ inputs.mode }}
          days: ${{ inputs.days }}
          seed: ${{ matrix.seed }}
          scene: ${{ matrix.scene }}
          decor: ${{ matrix.decor }}
          feed: ${{ matrix.feed }}
          year: ${{ matrix.year }}
          from-day: ${{ needs.plan.outputs.from10 }}
          to-day: ${{ needs.plan.outputs.to10 }}
          index: '10'
